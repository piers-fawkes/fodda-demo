  <style>
    /* ── Dossier tokens (CSS custom properties) ──────────── */
    :root {
      --cream:        #fafafa;
      --paper:        #ffffff;
      --ink:          #17161a;
      --ink-2:        #3f3e43;
      --ink-3:        #7a7880;
      --ink-4:        #b8b6bd;
      --ink-5:        #e4e2e7;
      --line:         #ececec;
      --line-soft:    #f4f4f4;
      --line-strong:  #d8d8d8;
      --brand:        #663399;
      --brand-dark:   #4a2470;
      --brand-soft:   #f1eafa;
      --brand-softer: #f8f4fd;
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Scrollbar (light) ─────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ink-4);
      border-radius: 4px;
      transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-3);
    }

    .no-bounce {
      overscroll-behavior: none;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Dossier eyebrow utility ───────────────────────────── */
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .eyebrow-brand { color: var(--brand); }

    /* ── Fodda Gradient (kept for avatar accents only) ─────── */
    .fodda-gradient {
      background: linear-gradient(135deg, #7c3aed 0%, #663399 35%, #a855f7 65%, #ec4899 100%);
    }

    .fodda-gradient-text {
      background: linear-gradient(135deg, #7c3aed 0%, #663399 35%, #a855f7 65%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Shimmer (light-mode) ──────────────────────────────── */
    @keyframes fodda-shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .fodda-shimmer {
      background: linear-gradient(90deg,
          var(--brand-softer) 0%,
          var(--brand-soft) 25%,
          rgba(102, 51, 153, 0.12) 50%,
          var(--brand-soft) 75%,
          var(--brand-softer) 100%);
      background-size: 200% 100%;
      animation: fodda-shimmer 2s ease-in-out infinite;
    }

    /* ── Glass (light — frosted white) ─────────────────────── */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
    }

    .glass-subtle {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px) saturate(1.2);
      -webkit-backdrop-filter: blur(12px) saturate(1.2);
    }

    /* ── Slide-in for drawers ──────────────────────────────── */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0.8; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .animate-slide-in-right {
      animation: slideInRight 0.25s ease-out forwards;
    }

    /* ── Prompt bar glow (light) ───────────────────────────── */
    .prompt-bar {
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .prompt-bar:focus-within {
      border-color: var(--brand) !important;
      box-shadow:
        0 0 0 1px rgba(102, 51, 153, 0.15),
        0 0 12px rgba(102, 51, 153, 0.06);
    }

    /* ── Accent pulse (live indicators) ────────────────────── */
    @keyframes accent-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(102, 51, 153, 0.3); }
      50%      { box-shadow: 0 0 0 4px rgba(102, 51, 153, 0); }
    }

    .accent-pulse {
      animation: accent-pulse 2s ease-in-out infinite;
    }

    /* ── Card hover lift (light) ───────────────────────────── */
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card-hover:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    /* ── Checkout banner slide-in ────────────────────────── */
    @keyframes checkoutSlideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Smooth global transitions ─────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
